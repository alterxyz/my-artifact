<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Alterxyz 的 artifacts 索引。收集来自对话、实验与工具的交互页面、图解和小作品。">
  <meta name="theme-color" content="#f7f5ee">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://artifact.alterxyz.com/">
  <link rel="stylesheet" href="/style.css">
  <title>Artifacts — Alterxyz</title>
</head>
<body>
  <a class="skip" href="#collection">跳到作品</a>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="/" aria-label="Alterxyz artifacts 首页"><span class="brand-icon" aria-hidden="true">a<span>·</span></span>ALTERXYZ<span class="brand-divider">/</span><span class="brand-section">artifacts</span></a>
      <a class="index-link" href="#collection">浏览作品 <span aria-hidden="true">↙</span></a>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span class="status-dot" aria-hidden="true"></span> A PERSONAL COLLECTION</div>
        <h1 id="page-title">想法的<br><em>另一种形状。</em><span class="title-star" aria-hidden="true">✳</span></h1>
        <div class="intro-bottom"><p>一些对话，一些实验，一些顺手做出来的东西。<br>把散落各处的 artifacts，留一个入口。</p><span class="intro-label">PAGES · EXPLORATIONS · LITTLE THINGS</span></div>
      </section>
      <section class="collection" id="collection" aria-labelledby="collection-title">
        <div class="section-heading"><h2 id="collection-title">全部作品 <span class="count">{{COUNT}}</span></h2><span class="section-note">持续收录中 <span aria-hidden="true">↗</span></span></div>
        <div class="works">{{ARTIFACTS}}</div>
      </section>
      <aside class="endnote"><span class="endnote-mark" aria-hidden="true">＋</span><p>新的想法，会慢慢长到这里。</p></aside>
    </main>
    <footer><span>© 2026 ALTERXYZ / ARTIFACTS · 无担保</span><span><a href="https://github.com/alterxyz/my-artifact">源码</a> · <a href="https://github.com/alterxyz/my-artifact/blob/main/LICENSING.md">AGPL + 商业授权</a></span></footer>
  </div>
</body>
</html>

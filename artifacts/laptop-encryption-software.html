{u:'cat',era:1,t:'2023-08-20 11:02',ip:'加拿大',b:`
<p><b>写给这个帖子里的新人们</b></p>
<p>帖子越来越热闹了，作为版主说几句。我在这个论坛十几年，看过很多人走同一条路，大概是四步：</p>
<p><b>一、找工具。</b>你只是想锁个文件，搜到一个教程。教程本身没问题，但教程底下的评论、推荐阅读、相关链接，全都指向更深的地方。</p>
<p><b>二、进圈子。</b>你开始泡论坛、看清单。圈子有自己的话，也有自己的默认前提，最大的一条是：<i>你要防的不只是小偷，是政府、公司，和所有不加密的人。</i>这句话不一定错。但你一旦接受了它，后面的每个选择都在它的框里。</p>
<p><b>三、变成身份。</b>某天你发现，「注重隐私」不再是你做的一件事，而是你是谁。你开始给新人答疑，开始评判别人的安全习惯。到这一步，退出就不只是卸一个软件了，是放弃一部分自己。</p>
<p><b>四、分岔。</b>身份定了以后，外面发生的事会把不同的人推到不同的地方。同一批人里，我见过后来进大厂做安全的，见过出国的，也见过再也没上线的。</p>
<p>我不是劝你们别学。<b>我是希望你们知道，自己走在哪条路上。</b></p>`,sig:'BitLocker 不丢人。'},

{u:'cat',era:2,t:'2024-01-09 21:08',ip:'加拿大',b:`
<p>@理性讨论 「工具是中性的」，这话没错，但没用。</p>
<p>菜刀也是中性的，但菜刀不会把你拉进一个群，VeraCrypt 会。我说的从来不是工具能干什么，而是工具<b>连着</b>什么：社区、清单、一整套看世界的方式。</p>
<p>你可能还想说，大多数人什么事也没有。对，大多数抽大麻的人也没去碰更硬的东西。这条路不是说所有人都会走到底，而是说<b>路就在那儿，站在入口的人看不见尽头</b>。</p>
<p>还有一点很少有人提：楼主当初完全可以用 BitLocker，他选了 VeraCrypt。<b>选这个工具这件事本身，就已经不中立了。</b>它说明你心里对「谁是对手、多少保护才够、谁值得信」，已经有了一套跟普通人不一样的答案。</p>

{u:'tob',era:2,t:'2024-01-10 08:44',ip:'德国',b:`
<p>外国网友路过。同样一条路，在不同国家通向不同的地方：</p>
<ul>
<li>英国：法官可以签令让你交出密钥，<b>拒交本身就是罪</b>。</li>
<li>美国：没有专门的法律，靠第五修正案，结果看你遇到哪个法院。脑子里的密码比指纹受保护。</li>
<li>德国（我这里）：没有强制交钥。而且欧盟有 GDPR，很多人的隐私焦虑被法律接住了，不用全压在自己身上。</li>
<li>你们那边……我就不说了。</li>
</ul>
<p>我的感觉是：<b>gateway 最强的地方，往往就是制度最不保护隐私的地方。</b></p>`,tr:'德语',o:`
<p>Ausländer hier, nur auf der Durchreise. Derselbe Weg führt in verschiedenen Ländern an ganz verschiedene Orte:</p>
<ul>
<li>UK: Ein Richter kann anordnen, dass du deinen Schlüssel herausgibst – <b>schon die Weigerung ist eine Straftat</b>.</li>
<li>USA: Kein eigenes Gesetz, nur der Fünfte Zusatzartikel. Was dabei herauskommt, hängt davon ab, an welches Gericht du gerätst. Ein Passwort im Kopf ist besser geschützt als ein Fingerabdruck.</li>
<li>Deutschland (hier bei mir): Keine Pflicht zur Schlüsselherausgabe. Und mit der DSGVO fängt das Gesetz einen Teil der Angst um die Privatsphäre auf – man muss nicht alles allein tragen.</li>
<li>Bei euch … sage ich lieber nichts.</li>
</ul>
<p>Mein Eindruck: <b>Der Gateway-Effekt ist dort am stärksten, wo das System die Privatsphäre am wenigsten schützt.</b></p>`},

/* ======================= SCROLL-DRIVEN AMBIENCE ======================= */
const R = document.documentElement;
const pageStops = [[0,[233,237,242]],[.30,[222,223,230]],[.47,[96,88,112]],[.60,[28,21,36]],[1,[6,3,10]]];
const headStops = [[0,[47,93,138]],[.30,[52,72,112]],[.50,[40,26,62]],[.72,[18,9,30]],[1,[10,3,16]]];
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function at(stops,p){
  for(let i=0;i<stops.length-1;i++){
    const [p0,c0]=stops[i],[p1,c1]=stops[i+1];
    if(p<=p1){const t=clamp((p-p0)/(p1-p0));return `rgb(${c0.map((v,k)=>Math.round(v+(c1[k]-v)*t)).join(',')})`;}
  }
  return `rgb(${stops[stops.length-1][1].join(',')})`;
}
const ramp=(p,a,b)=>clamp((p-a)/(b-a));

const online = document.getElementById('online'), login = document.getElementById('login'), logo = document.getElementById('logo');
let P = 0;
function update(){
  const max = document.documentElement.scrollHeight - innerHeight;
  P = max>0 ? clamp(scrollY/max) : 0;
  R.style.setProperty('--page', at(pageStops,P));
  R.style.setProperty('--head', at(headStops,P));
  R.style.setProperty('--blob', (ramp(P,.5,1)*.32).toFixed(3));
  R.style.setProperty('--scan', (ramp(P,.62,1)*.07).toFixed(3));
  R.style.setProperty('--noise', (ramp(P,.7,1)*.06).toFixed(3));
  R.style.setProperty('--vig', (ramp(P,.4,1)*.55).toFixed(3));
  online.textContent = P<.5 ? '当前在线 1,204 人' : P<.8 ? '当前在线 37 人' : P<.96 ? '当前在线 2 人' : '当前在线 2 人（你，白开水）';
  login.textContent  = P<.6 ? '登录 · 注册' : P<.9 ? '游客' : '欢迎回来';
  revealCracks();
}

/* ---------- cracks ---------- */
const svg = document.getElementById('cracks');
let cracks = [], revealed = new Set();
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function buildCracks(){
  const r = rng(20261116);
  const W = document.documentElement.clientWidth, H = document.documentElement.scrollHeight;
  const wr = document.getElementById('wrap').getBoundingClientRect();
  const L = wr.left + 18, Rt = wr.right - 18;
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const N = W<720 ? 16 : 30;
  let out = ''; cracks = [];
  for(let i=0;i<N;i++){
    const y0 = H*(.30 + .68*Math.sqrt(r()));
    const left = r()<.5;
    // start at the card edge, run outward into the margin (and a little onto the card frame late on)
    let x = left ? L + (r()*24 - (y0>H*.78?18:0)) : Rt - (r()*24 - (y0>H*.78?18:0));
    let y = y0, ang = left ? Math.PI + (r()-.5)*1.1 : (r()-.5)*1.1;
    const segs = 6 + Math.floor(r()*9);
    let d = `M${x.toFixed(1)} ${y.toFixed(1)}`, branches = '';
    for(let s=0;s<segs;s++){
      const len = 14 + r()*42;
      ang += (r()-.5)*0.9;
      x += Math.cos(ang)*len; y += Math.sin(ang)*len*.8;
      d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
      if(r()<.28){
        let bx=x,by=y,ba=ang+(r()<.5?1:-1)*(.6+r()*.7),bd=`M${bx.toFixed(1)} ${by.toFixed(1)}`;
        const bs=2+Math.floor(r()*3);
        for(let k=0;k<bs;k++){const bl=8+r()*22;ba+=(r()-.5)*.8;bx+=Math.cos(ba)*bl;by+=Math.sin(ba)*bl*.8;bd+=` L${bx.toFixed(1)} ${by.toFixed(1)}`;}
        branches += `<path class="s" pathLength="1" d="${bd}"/><path class="h" pathLength="1" d="${bd}" transform="translate(.9 .9)"/>`;
      }
    }
    cracks.push(y0);
    out += `<g data-i="${i}" class="${revealed.has(i)?'on':''}"><path class="s" pathLength="1" d="${d}"/><path class="h" pathLength="1" d="${d}" transform="translate(.9 .9)"/>${branches}</g>`;
  }
  svg.innerHTML = out;
}
function revealCracks(){
  if(P<.26) return;
  const edge = scrollY + innerHeight*.85;
  cracks.forEach((y,i)=>{
    if(!revealed.has(i) && y<edge){ revealed.add(i); const g=svg.querySelector(`g[data-i="${i}"]`); if(g) requestAnimationFrame(()=>g.classList.add('on')); }
  });
}

/* ---------- flicker around the text, never the text itself ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flicker(){
  if(!reduce && P>.45){
    const pool = [document.getElementById('top'), ...document.querySelectorAll('.up .av, .pager span, .sysline span')];
    const vis = pool.filter(el=>{const b=el.getBoundingClientRect();return b.bottom>0&&b.top<innerHeight;});
    const n = 1 + Math.floor(ramp(P,.45,1)*3);
    for(let i=0;i<n&&vis.length;i++){
      const el = vis[Math.floor(Math.random()*vis.length)];
      el.classList.remove('flick'); void el.offsetWidth; el.classList.add('flick');
    }
    if(P>.45 && Math.random()<.3){
      const cz=[...document.querySelectorAll('.cz')].filter(el=>{const b=el.getBoundingClientRect();return b.bottom>0&&b.top<innerHeight;});
      if(cz.length) reveal(cz[Math.floor(Math.random()*cz.length)],160);
    }
    if(P>.8 && Math.random()<.35){
      logo.firstChild.textContent = Math.random()<.5 ? '小机▓' : '██房';
      setTimeout(()=>logo.firstChild.textContent='小机房', 120);
    }
  }
  const gap = P>.45 ? 2600 - ramp(P,.45,1)*2000 : 1500;
  setTimeout(flicker, gap*(.6+Math.random()*.8));
}

/* ---------- the filtered name ---------- */
function reveal(el,ms){
  if(el._t) clearTimeout(el._t);
  if(!el.dataset.mask) el.dataset.mask = el.textContent;
  el.textContent='编程随想'; el.classList.add('real');
  el._t=setTimeout(()=>{el.textContent=el.dataset.mask;el.classList.remove('real');},ms);
}
document.querySelectorAll('.cz').forEach(el=>el.addEventListener('click',()=>reveal(el,1200)));
document.querySelectorAll('.tro').forEach(el=>el.addEventListener('click',()=>{
  const pm=el.closest('.pm'), t=pm.querySelector('.pb:not(.pbo)'), o=pm.querySelector('.pbo');
  const showO=o.hidden; o.hidden=!showO; t.hidden=showO; el.textContent=showO?'查看译文':'查看原文';
}));

let tick=false;
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(()=>{update();tick=false;});}},{passive:true});
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{buildCracks();update();},200);});
buildCracks(); update(); flicker();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{buildCracks();update();});
})();
</script>
